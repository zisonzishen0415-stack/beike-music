name: Ingest uploads

on:
  push:
    paths:
      - 'uploads/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest-uploads
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Check for supported files
        id: check
        run: |
          if find uploads -type f \( -iname '*.pdf' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' -o -iname '*.zip' \) | grep -q .; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ingest
        if: steps.check.outputs.has == 'true'
        run: python scripts/ingest.py --src uploads --prune

      - name: Commit generated library
        if: steps.check.outputs.has == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A scores thumbs data/scores.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Rebuild library from uploads"
            git push origin HEAD:main
          fi
